##
# Scenarios are optional, named combinations of overrides
##
scenarios:
  # more_renewables: ["higher_wind","higher_solar"]
  # generation_outage: ["lower_ccgt"]
  baseline: []
  surplus_to_battery: ["enable_battery_pathway"]
  surplus_to_hydrogen: ["enable_hydrogen_pathway"]
  surplus_to_big_user: ["enable_big_user_pathway"]

##
# Overrides are the building blocks from which scenarios can be defined
##
overrides:


  enable_battery_pathway:
    nodes:
      NLD:
        techs:
          battery_storage:
            flow_cap: 1200 # MW
            storage_cap: 4920 # MWh (about 4.1h at rated power)
          electrolyser:
            flow_cap: 0
          hydrogen_storage:
            flow_cap: 0
            storage_cap: 0
          fuel_cell:
            flow_cap: 0
          demand_big_user:
            sink_use_max: 0

  enable_hydrogen_pathway:
    nodes:
      NLD:
        techs:
          battery_storage:
            flow_cap: 0
          electrolyser:
            flow_cap: 1000 # MW
          hydrogen_storage:
            flow_cap: 500 # MW
            storage_cap: 5000 # MWh_h2
          fuel_cell:
            flow_cap: 500 # MW
          demand_big_user:
            sink_use_max: 0

  enable_big_user_pathway:
    techs:
      demand_big_user:
        cost_flow_in:
          data: -0.02 # kEUR per MWh revenue-equivalent for delivered power
          index: monetary
          dims: costs
    nodes:
      NLD:
        techs:
          battery_storage:
            flow_cap: 0
          electrolyser:
            flow_cap: 0
          hydrogen_storage:
            flow_cap: 0
            storage_cap: 0
          fuel_cell:
            flow_cap: 0
          demand_big_user:
            sink_use_max: 2500 # MW flexible demand ceiling
